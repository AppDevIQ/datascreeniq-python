[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datascreeniq"
version = "1.0.11"
description = "Real-time data quality screening API — PASS / WARN / BLOCK in milliseconds"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

dependencies = [
  "requests>=2.28.0",
  "certifi>=2023.0.0"
]

keywords = [
  "data-quality",
  "data-validation",
  "data-pipeline",
  "etl",
  "schema-validation",
  "data-engineering",
  "api-client"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries"
]

[project.optional-dependencies]
pandas     = ["pandas>=1.3.0"]
excel      = ["openpyxl>=3.0.0"]
truststore = ["truststore>=0.10.0"]
windows    = ["certifi-win32>=1.6.1"]
all        = [
  "pandas>=1.3.0",
  "openpyxl>=3.0.0",
  "truststore>=0.10.0",
  "certifi-win32>=1.6.1"
]

[project.urls]
Homepage      = "https://datascreeniq.com"
Documentation = "https://datascreeniq.com/docs"
Source        = "https://github.com/AppDevIQ/datascreeniq-python"
Tracker       = "https://github.com/AppDevIQ/datascreeniq-python/issues"
Privacy       = "https://datascreeniq.com/privacy"

[tool.setuptools.packages.find]
exclude = ["tests*", "examples*"]
